<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training Tracker</title>
  <meta name="description" content="Log workouts, sets and reps, and track your progress.">
  <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)">

  <!-- iOS home screen app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Workout</h1>
    <div id="topbar-action"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- Shown on other tabs while a workout is in progress (workout.js) -->
  <button type="button" id="live-bar" class="live-bar hidden" data-action="continue-workout">
    <span class="live-dot" aria-hidden="true"></span>
    <span class="lb-text"><span id="lb-name" class="truncate"></span><span id="lb-time"></span></span>
    <span class="lb-go">Continue ›</span>
  </button>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7M6 9.5V20h12V9.5M10 20v-5.5h4V20"/></svg>
      <span>Today</span>
    </button>
    <button data-tab="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
      <span>Train</span>
    </button>
    <button data-tab="plans">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"/></svg>
      <span>Plans</span>
    </button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 15l4-4 3 3 5-6"/></svg>
      <span>Progress</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>History</span>
    </button>
  </nav>

  <!-- Bottom sheet for pickers and details -->
  <div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
  <section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></section>

  <script src="calc.js"></script>
  <script src="backup.js"></script>
  <script src="workout.js"></script>
  <script src="bodyweight.js"></script>
  <script src="plans.js"></script>
  <script src="programs.js"></script>
  <script src="plans-ui.js"></script>
  <script src="home.js"></script>
  <script src="app.js"></script>
  <script src="stats.js"></script>
  <script src="insights.js"></script>
</body>
</html>
